[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.89"

[workspace.dependencies]
neki-build = { path = "crates/neki-build" }
neki-core = { path = "crates/neki-core" }
neki-derivation = { path = "crates/neki-derivation" }
neki-eval = { path = "crates/neki-eval" }
neki-fetch = { path = "crates/neki-fetch" }
neki-hash = { path = "crates/neki-hash" }
neki-nar = { path = "crates/neki-nar" }
neki-platform = { path = "crates/neki-platform" }
neki-profile = { path = "crates/neki-profile" }
neki-project = { path = "crates/neki-project" }
neki-shim = { path = "crates/neki-shim" }
neki-store = { path = "crates/neki-store" }
neki-substitute = { path = "crates/neki-substitute" }

anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
data-encoding = "2"
dirs = "6"
ed25519-dalek = "3"
flate2 = "1"
getrandom = "0.4"
junction = "2.1"
lzma-rs = "0.3"
process-wrap = { version = "10", default-features = false, features = ["std", "process-group", "job-object"] }
regex = "1"
rfd = "0.17"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
slint = "1"
slint-build = "1"
tar = { version = "0.4", default-features = false }
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml = "0.9"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
zstd = "0.14"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
