name: Build release archives

# Builds and tests one commit natively on every release platform and uploads an archive per
# platform (artifacts `neki-<platform>`). Called by release.yml and nightly-release.yml, which
# then publish the archives. The Apple Silicon archive is also run on macOS 15, the oldest
# macOS Neki supports.
on:
  workflow_call:
    inputs:
      version:
        description: "Version written into the build and the archive names, e.g. v0.2.0"
        required: true
        type: string
      sha:
        description: "Commit to build"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            name: linux-x86_64
          - runner: macos-latest
            name: macos-arm64
          - runner: macos-15-intel # GitHub's Intel macOS runner
            name: macos-x86_64
          - runner: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # Git Bash on Windows, for package-release.sh
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      # Same shared key as CI: this runs on main, and pull requests can restore caches saved on
      # main, so new pull requests start with the dependencies already compiled.
      - name: Build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os }}-${{ runner.arch }}

      - name: Install Slint system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev

      - name: Test
        run: cargo test --workspace --locked

      - name: Build and archive the release
        id: package
        env:
          VERSION: ${{ inputs.version }}
        run: |
          archive="$(./scripts/package-release.sh "$VERSION" | tail -n 1)"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: neki-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  # The Apple Silicon archive is built on macos-latest, a newer macOS than the oldest one Neki
  # supports: check that it unpacks and runs on macOS 15. Nothing is built here.
  run-on-macos-15:
    name: Run macos-arm64 on macOS 15
    needs: build
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: neki-macos-arm64

      - name: Unpack and run
        env:
          NEKI_STORE_DIR: ${{ runner.temp }}/store
          NEKI_STATE_DIR: ${{ runner.temp }}/var
        run: |
          sw_vers
          tar -xzf neki-*-macos-arm64.tar.gz
          cd neki-*-macos-arm64
          ./neki --version
          ./neki eval '1 + 1'
          # Without a .shim file next to it, neki-shim starts and exits with 127; a binary that
          # can't load on this macOS fails differently.
          status=0
          ./neki-shim || status=$?
          [ "$status" = 127 ]
          # The desktop app starts and is still running after a few seconds.
          ./neki-desktop &
          pid=$!
          sleep 5
          kill -0 "$pid"
          kill "$pid"
